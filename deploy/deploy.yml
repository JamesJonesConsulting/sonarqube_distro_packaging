- name: Deploy SonarQube rpm package
  hosts: "{{ target_group }}"
  # connection: local
  vars_files:
    - ./vars/main.yml
  tasks:
    - name: Setup SonarQube Nexus repository
      ansible.builtin.copy:
        src: files/nexus-sonarqube.repo
        dest: /etc/yum.repos.d/nexus-sonarqube.repo
        owner: root
        group: root
        mode: '0644'
    - name: Install SonarQube package
      ansible.builtin.yum:
        name: sonarqube
        update_cache: true
        state: latest 
