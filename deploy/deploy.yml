- name: Deploy SonarQube rpm package
  hosts: "{{ target_group }}"
  # connection: local
  vars_files:
    - ./vars/main.yml
  pre_tasks:
    - name: Ensure python3-libdnf5 is installed on the target hosts
      ansible.builtin.command:
        cmd: dnf install -y python3-libdnf5
  tasks:
    - name: Setup SonarQube Nexus repository
      ansible.builtin.copy:
        src: files/nexus-sonarqube.repo
        dest: /etc/yum.repos.d/nexus-sonarqube.repo
        owner: root
        group: root
        mode: '0644'
    - name: Clean all DNF caches
      ansible.builtin.command:
        cmd: dnf clean all
      changed_when: true
    - name: Install SonarQube package
      ansible.builtin.dnf:
        name: sonarqube
        update_cache: true
        state: latest
    - name: Update sonar.properties with the correct JDBC URL
      ansible.builtin.ini_file:
        path: /opt/sonarqube/conf/sonar.properties
        no_extra_spaces: true
        option: "{{ setting.option }}"
        value: "{{ setting.value }}"
      loop:
        - option: sonar.jdbc.username
          value: "{{ sonarqube_pg_user }}"
        - option: sonar.jdbc.password
          value: "{{ sonarqube_pg_pass }}"
        - option: sonar.jdbc.url
          value: "jdbc:postgresql://{{ sonarqube_host }}:{{ sonarqube_port }}/{{ sonarqube_db }}?currentSchema=public"
        - option: sonar.web.https.port
          value: "{{ sonarqube_https_port }}"
        # - option: sonar.web.https.keyAlias
        #   value: "{{ sonarqube_https_alias }}"
        - option: sonar.web.https.keyStore
          value: "{{ sonarqube_keystore_file }}"
        # - option: sonar.web.https.keyStoreType
        #   value: PKCS12
        - option: sonar.web.https.keyStorePassword
          value: "{{ sonarqube_keystore_password }}"
        - option: sonar.web.port
          value: "-1"
      loop_control:
        loop_var: setting
    - name: Ensure the SonarQube Keystore directory exists
      ansible.builtin.file:
        path: "{{ sonarqube_keystore_file | dirname }}"
        state: directory
        owner: sonarqube
        group: sonarqube
        mode: "0750"
    - name: Ensure any exiting keystore file is removed before creating a new one
      ansible.builtin.file:
        path: "{{ sonarqube_keystore_file }}"
        state: absent
    - name: Create PKCS#12 keystore
      ansible.builtin.command:
        argv:
          - openssl
          - pkcs12
          - -export
          - -out
          - "{{ sonarqube_keystore_file }}"
          - -inkey
          - "{{ sonarqube_tls_key }}"
          - -in
          - "{{ sonarqube_tls_cert }}"
          - -certfile
          - "{{ sonarqube_tls_ca_chain }}"
          - -name
          - "{{ sonarqube_https_alias }}"
          - -passout
          - "pass:{{ sonarqube_keystore_password }}"
      args:
        creates: "{{ sonarqube_keystore_file }}"
      no_log: true
    - name: Ensure the SonarQube keystore is owned by the SonarQube service account
      ansible.builtin.file:
        path: "{{ sonarqube_keystore_file }}"
        owner: sonarqube
        group: sonarqube
        mode: "0640"
