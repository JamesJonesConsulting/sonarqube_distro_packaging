# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml
parameters:
  - name: version
    displayName: SonarQube Download version
    type: string
    default: 26.9.0.129388
  - name: target_group
    displayName: Target group for deployment
    type: string
    default: sonarqube
  - name: inventory
    displayName: Ansible inventory to use for deployment
    type: string
    default: home
    values:
      - home
# trigger:
#   branches:
#     include:
#       - feature/*
#       - release/*
#   tags:
#     include:
#       - '*'
# pr:
#   branches:
#     include:
#       - develop

resources:
  repositories:
    - repository: inventory
      type: github
      name: JamesJonesConsulting/AnsibleInventory
      endpoint: JamesJonesConsulting      
    - repository: vault
      type: github
      name: JamesJonesConsulting/AnsibleVault
      endpoint: JamesJonesConsulting
  containers:
    - container: podman-dind
      image: nexus.jamesjonesconsulting.com:5443/jamesjonesconsulting/podman-dind-like:latest
      endpoint: JamesJonesConsultingDockerNexusHosted
      options: --userns=keep-id --privileged --user root
pool: FedoraHosted
container: podman-dind
variables:
  - group: Connections
  - name: ARTIFACTORY_HOST
    value: nexus.jamesjonesconsulting.com

steps:
  - checkout: self 
    path: s/pipeline
  - checkout: inventory
    path: s/inventory
  - checkout: vault
    path: s/vault
  - script: echo Hello, world!
    displayName: 'Run a one-line script'

  - script: |
      echo Add other tasks to build, test, and deploy your project.
      echo See https://aka.ms/yaml
      ls -all $(Build.SourcesDirectory)/inventory/${{ parameters.inventory }}
      ansible-playbook \
        -i $(Build.SourcesDirectory)/inventory/${{ parameters.inventory }}/hosts \
        deploy/deploy.yml \
        -e "target_group=${{ parameters.target_group }}"
    displayName: 'Run a multi-line script'
    workingDirectory: $(Build.SourcesDirectory)/pipeline
